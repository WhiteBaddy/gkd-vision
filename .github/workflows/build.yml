name: build

on:
  push:
    branches: [main]
    paths:
      - 'driver/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Ensure rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ci-latest >/dev/null 2>&1 || \
            gh release create ci-latest --prerelease --title "CI latest" --notes "rolling build artifacts (anonymous download)"

      - name: Assemble debug APK
        run: |
          set -o pipefail
          gradle -p driver :driver-app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload APK to rolling release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ci-latest driver/driver-app/build/outputs/apk/debug/*.apk --clobber

      - name: Upload build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ci-latest build.log --clobber || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-artifacts
          path: |
            driver/driver-app/build/outputs/apk/debug/*.apk
            build.log
          if-no-files-found: warn
